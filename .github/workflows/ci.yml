name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/CODEOWNERS"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".gitignore"
      - ".idea/**"
      - ".vscode/**"
      - "LICENSE*"
      - "docs/**"

permissions:
  contents: read

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Go module files
        run: go mod verify && go mod tidy -diff
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Run Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: Check for unreachable Go code
        run: go run golang.org/x/tools/cmd/deadcode@v0.49.0 ./...
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Pin npm
        run: npm install --global npm@11.17.0
      - name: Test release packaging
        run: npm test --prefix packaging/npm
      - name: Install Studio dependencies
        working-directory: web
        run: npm ci
      - name: Audit Studio dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --verbose .

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build executable
        run: go build -trimpath -o ./kick-sim${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/kick-sim
      - name: Smoke test executable
        shell: bash
        run: ./kick-sim${{ runner.os == 'Windows' && '.exe' || '' }} --help

  studio:
    name: Studio contract and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.17.0
      - name: Install Studio dependencies
        working-directory: web
        run: npm ci
      - name: Generate API artifacts
        run: make generate
      - name: Check generated API drift
        run: git diff --exit-code -- web/openapi.json web/src/api/generated
      - name: Test and build Studio
        working-directory: web
        run: npm run check && npm test && npm run build
      - name: Build embedded executable
        run: go build -trimpath -tags studio_embed -o ./kick-sim ./cmd/kick-sim
      - name: Test embedded assets
        run: go test -tags studio_embed ./web ./internal/studio
      - name: Smoke test embedded executable
        shell: bash
        run: |
          ./kick-sim --help
          ./kick-sim --output json version
          ./kick-sim --workspace "$RUNNER_TEMP/kick-sim-workspace" init
          ./kick-sim --workspace "$RUNNER_TEMP/kick-sim-workspace" workspace validate
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test embedded Studio workflow
        working-directory: web
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  release-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Studio assets
        run: npm install --global npm@11.17.0 && npm ci --prefix web && make web
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Build npm distribution bundle
        run: >-
          node packaging/npm/scripts/build.mjs
          --dist dist
          --out dist/distribution/npm
      - name: Collect package-manager manifests
        run: >-
          node packaging/release/collect.mjs
          --dist dist
          --out dist/distribution
      - name: Validate generated manifests
        shell: bash
        run: |
          ruby -c dist/distribution/homebrew/kick-sim.rb
          node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync("dist/distribution/scoop/kick-sim.json")); if (!value.version || !/^[a-f0-9]{64}$/.test(value.architecture?.["64bit"]?.hash)) process.exit(1)'
      - name: Smoke test release binary
        shell: bash
        run: |
          binary="$(find dist -type f -name kick-sim -path '*linux_amd64*' -print -quit)"
          test -n "$binary"
          "$binary" --help
          "$binary" --output json version
          "$binary" --workspace "$RUNNER_TEMP/release-workspace" init
          "$binary" --workspace "$RUNNER_TEMP/release-workspace" workspace validate
      - name: Upload snapshot distribution
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-distribution
          path: dist/distribution
          if-no-files-found: error
          retention-days: 1

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    needs: release-snapshot
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: snapshot-distribution
          path: distribution
      - name: Smoke test packaged executable and Studio
        run: node packaging/npm/scripts/smoke.mjs --bundle distribution/npm
      - name: Audit generated Homebrew Cask
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew tap-new --no-git kick-sim/ci
          trap 'brew untap kick-sim/ci' EXIT
          tap_path="$(brew --repository kick-sim/ci)"
          mkdir -p "$tap_path/Casks"
          cp distribution/homebrew/kick-sim.rb "$tap_path/Casks/kick-sim.rb"
          brew audit --cask --strict kick-sim/ci/kick-sim

  required:
    name: Required CI
    if: always()
    needs:
      - quality
      - test
      - studio
      - release-snapshot
      - package-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required jobs passed
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          STUDIO_RESULT: ${{ needs.studio.result }}
          RELEASE_SNAPSHOT_RESULT: ${{ needs.release-snapshot.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package-smoke.result }}
        run: |
          for result in \
            "$QUALITY_RESULT" \
            "$TEST_RESULT" \
            "$STUDIO_RESULT" \
            "$RELEASE_SNAPSHOT_RESULT" \
            "$PACKAGE_SMOKE_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job completed with result: $result"
              exit 1
            fi
          done
