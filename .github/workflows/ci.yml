name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/CODEOWNERS"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".gitignore"
      - ".idea/**"
      - ".vscode/**"
      - "LICENSE*"
      - "docs/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/CODEOWNERS"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - ".gitignore"
      - ".idea/**"
      - ".vscode/**"
      - "LICENSE*"
      - "docs/**"

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build executable
        run: go build -trimpath -o ./kick-sim${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/kick-sim
      - name: Smoke test executable
        shell: bash
        run: ./kick-sim${{ runner.os == 'Windows' && '.exe' || '' }} --help

  studio:
    name: Studio contract and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.17.0
      - name: Install Studio dependencies
        working-directory: web
        run: npm ci
      - name: Generate API artifacts
        run: make generate
      - name: Check generated API drift
        run: git diff --exit-code -- web/openapi.json web/src/api/generated
      - name: Test and build Studio
        working-directory: web
        run: npm test && npm run build
      - name: Build embedded executable
        run: go build -trimpath -tags studio_embed -o ./kick-sim ./cmd/kick-sim
      - name: Test embedded assets
        run: go test -tags studio_embed ./web ./internal/studio
      - name: Smoke test embedded executable
        shell: bash
        run: |
          ./kick-sim --help
          ./kick-sim --output json version
          ./kick-sim --workspace "$RUNNER_TEMP/kick-sim-workspace" init
          ./kick-sim --workspace "$RUNNER_TEMP/kick-sim-workspace" workspace validate
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test embedded Studio workflow
        working-directory: web
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  release-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Studio assets
        run: npm install --global npm@11.17.0 && npm ci --prefix web && make web
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean
      - name: Smoke test release binary
        shell: bash
        run: |
          binary="$(find dist -type f -name kick-sim -path '*linux_amd64*' -print -quit)"
          test -n "$binary"
          "$binary" --help
          "$binary" --output json version
          "$binary" --workspace "$RUNNER_TEMP/release-workspace" init
          "$binary" --workspace "$RUNNER_TEMP/release-workspace" workspace validate
