version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Let routine releases settle before proposing them. Security updates are
    # not subject to Dependabot cooldowns.
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      studio-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 5
