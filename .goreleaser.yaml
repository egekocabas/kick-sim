# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: kick-sim

builds:
  - id: kick-sim
    main: ./cmd/kick-sim
    binary: kick-sim
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    tags:
      - studio_embed
    ldflags:
      - >-
        -s -w
        -X github.com/egekocabas/kick-sim/internal/version.Version={{.Version}}
        -X github.com/egekocabas/kick-sim/internal/version.Commit={{.Commit}}
        -X github.com/egekocabas/kick-sim/internal/version.Date={{.Date}}

archives:
  - id: binaries
    ids:
      - kick-sim
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: kick-sim
    ids:
      - binaries
    binaries:
      - kick-sim
    url:
      template: >-
        https://github.com/egekocabas/kick-sim/releases/download/{{ .Tag }}/{{ .ArtifactName }}
      verified: github.com/egekocabas/kick-sim/
    directory: Casks
    homepage: https://github.com/egekocabas/kick-sim
    description: Local-only simulator for building and testing Kick webhook integrations
    repository:
      owner: egekocabas
      name: homebrew-tap
      branch: main
    skip_upload: true

scoops:
  - name: kick-sim
    url_template: >-
      https://github.com/egekocabas/kick-sim/releases/download/{{ .Tag }}/{{ .ArtifactName }}
    homepage: https://github.com/egekocabas/kick-sim
    description: Local-only simulator for building and testing Kick webhook integrations
    license: MIT
    repository:
      owner: egekocabas
      name: scoop-bucket
      branch: main
    skip_upload: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: egekocabas
    name: kick-sim
  prerelease: auto
