version: 2

project_name: kick-sim

builds:
  - id: kick-sim
    main: ./cmd/kick-sim
    binary: kick-sim
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    tags:
      - studio_embed
    ldflags:
      - >-
        -s -w
        -X github.com/egekocabas/kick-sim/internal/version.Version={{.Version}}
        -X github.com/egekocabas/kick-sim/internal/version.Commit={{.Commit}}
        -X github.com/egekocabas/kick-sim/internal/version.Date={{.Date}}

archives:
  - id: binaries
    ids:
      - kick-sim
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  prerelease: auto
